server {
    listen 80;

    # CORS for architecture.html live telemetry (file:// or separately hosted page polls via :8000).
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Simple GETs never preflight, but answer OPTIONS so browsers can probe from any origin.
    if ($request_method = OPTIONS) {
        return 204;
    }

    location /api/users {
        proxy_pass http://user-service:3001/users;
    }

    location /api/products {
        proxy_pass http://product-service:3002/products;
    }

    location /api/orders {
        proxy_pass http://order-service:3003/orders;
    }

    location /api/inventory {
        proxy_pass http://inventory-service:3004/inventory;
    }

    location /api/reviews {
        proxy_pass http://review-service:3005/reviews;
    }
}
