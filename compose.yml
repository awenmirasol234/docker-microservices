services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/users_db
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./product-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/products_db
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/inventory_db
    depends_on:
      postgres:
        condition: service_healthy

  review-service:
    build: ./review-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reviews_db
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build: ./nginx
    ports:
      - "8000:80"
    depends_on:
      - user-service
      - product-service
      - order-service
      - inventory-service
      - review-service

volumes:
  pgdata:
